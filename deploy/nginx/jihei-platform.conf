# G1211吉黑高速明水至北安段工程建设项目综合管理平台 — Nginx 生产部署配置
# 说明：将外部 8088（或生产 80/443）反向代理至 Next.js standalone 服务 (127.0.0.1:3000)

upstream jihei_nextjs_upstream {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 8088;
    server_name _;

    client_max_body_size 50m;

    # 启用 Gzip 压缩（加速 CesiumJS / JS / CSS / JSON 传输）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml model/gltf-binary;

    # Next.js 哈希静态资源长期缓存
    location /_next/static/ {
        proxy_pass http://jihei_nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # CesiumJS 本地内核与工程影像静态资产缓存
    location /lib/cesium/ {
        proxy_pass http://jihei_nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location /assets/ {
        proxy_pass http://jihei_nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location /models/ {
        proxy_pass http://jihei_nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # AI SDK 流式输出（必须关闭缓冲，保证逐字流式响应零延迟）
    location /api/ai/ {
        proxy_pass http://jihei_nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
    }

    # 默认反向代理至 Next.js 全栈服务
    location / {
        proxy_pass http://jihei_nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
